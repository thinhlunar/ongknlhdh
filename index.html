const ALL=[{"set": "Bộ trích xuất 47 câu", "source_num": 1, "q": "Thuật toán lập lịch SRTF: Một hệ điều hành sử dụng thuật toán lập lịch Shortest Remaining Time First (SRTF) cho các tiến hành theo cơ chế không độc quyền (preemptive). Giả sử tập các Tiến trình với thời điểm đến (Arrival Time), Thời gian đốt cháy CPU (Burst Time) lần lượt là P1(0, 14), P2(2, 4), P3(3, 6), P4(8, 5). Thời gian chờ trung bình của các Tiến trình là:", "options": ["5.25", "5.5", "7.25", "3.25"], "labels": ["A", "B", "C", "D"], "answer": ["B"], "id": 1, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 2, "q": "Vấn đề Test-and-Set: Vấn đề với Test-and-Set khi nhiều tiến trình đang chờ để vào Critical Session chống lại việc truy cập vào tập tài nguyên có thể xảy ra vì các tiến trình:", "options": ["deadlock", "starvation", "error", "synchronization"], "labels": ["A", "B", "C", "D"], "answer": ["B"], "id": 2, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 3, "q": "Lệnh Linux: Các lệnh của hệ điều hành Linux được thông dịch bởi:", "options": ["compiler", "shell", "command", "prompt"], "labels": ["A", "B", "C", "D"], "answer": ["B"], "id": 3, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 4, "q": "Thực thi System Call: Để thực thi một lời gọi hệ thống (system call) ở chế độ user, hãy sắp xếp các bước sau theo thứ tự thực hiện: 1. System call được xác định... 2. Đặt các tham số của system call vào stack. 3. Ngắt xảy ra để chuyển từ chế độ user sang chế độ kernel. 4. Sau khi hoàn tất, ngắt xảy ra lần nữa để chuyển sang chế độ user. 5. Điều khiển được quay lại...", "options": ["3, 2, 1, 4, 5", "3, 2, 1, 5, 4", "2, 3, 1, 5, 4", "2, 3, 1, 4, 5"], "labels": ["A", "B", "C", "D"], "answer": ["C"], "id": 4, "multi": false, "answer_idx": [2]}, {"set": "Bộ trích xuất 47 câu", "source_num": 5, "q": "Lợi ích của Multithread: Ích lợi của multithread trong kernel:", "options": ["Nếu một thread bị chặn không ảnh hưởng đến các thread khác.", "Phù hợp với kiến trúc nhiều bộ xử lý.", "Multithread quản lý trực tiếp bởi HĐH.", "Tạo và quản lý các thread ở mức thấp."], "labels": ["A", "B", "C", "D"], "answer": ["A", "B", "C"], "id": 5, "multi": true, "answer_idx": [0, 1, 2]}, {"set": "Bộ trích xuất 47 câu", "source_num": 6, "q": "Thời gian chờ nhỏ nhất: Có 5 tiến trình đang chờ để được chạy thực hiện, giả sử thời gian đốt cháy CPU lần lượt là 10, 6, 5, 8 và 15 mili giây. Giả sử các tiến trình không bị block trong quá trình thực thi. Thứ tự thực hiện sẽ như thế nào để thời gian chờ trung bình là nhỏ nhất?", "options": ["10, 8, 5, 4, 15", "15, 6, 5, 4, 10", "10, 6, 5, 8, 15", "4, 5, 6, 8, 10, 15 (Lưu ý: Dữ liệu thực tế cho thuật toán SJF sẽ ưu tiên tiến trình ngắn nhất là 5, 6, 8, 10, 15)"], "labels": ["A", "B", "C", "D"], "answer": ["D"], "id": 6, "multi": false, "answer_idx": [3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 7, "q": "Bộ nhớ CMOS: Phát biểu nào sau đây về CMOS là không đúng?", "options": ["Bộ nhớ CMOS có thể lưu giữ các tham số cấu hình của máy tính như boot từ đĩa nào.", "Bộ nhớ CMOS có thể lưu giữ các lệnh Assembly.", "Nhiều máy tính sử dụng bộ nhớ CMOS để lưu giữ ngày và giờ hiện hành.", "CMOS có thể thay đổi."], "labels": ["A", "B", "C", "D"], "answer": ["B"], "id": 7, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 8, "q": "Tiến trình Linux: Trong Linux sử dụng lệnh nào sau để list danh sách các tiến trình đang chạy?", "options": ["ls", "ps", "pc"], "labels": ["A", "B", "C"], "answer": ["B"], "id": 8, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 9, "q": "User Thread: Phát biểu nào sau đây về user thread là đúng?", "options": ["Khối điều khiển luồng (TCB) lưu trữ trạng thái của user thread.", "Một thread gồm: text, data, stack.", "Một gói các thread được quản lý bởi Kernel.", "Kernel không biết sự hiện diện của user thread."], "labels": ["A", "B", "C", "D"], "answer": ["A", "D"], "id": 9, "multi": true, "answer_idx": [0, 3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 10, "q": "BIOS: Phát biểu nào sau đây về BIOS là đúng?", "options": ["BIOS không lưu giữ trong flash RAM.", "BIOS chứa phần mềm Vào - ra mức thấp.", "Xác định boot device bằng cách tìm trong danh sách các thiết bị được lưu trong CMOS memory.", "Không thể update bởi hệ điều hành khi bị lỗi."], "labels": ["A", "B", "C", "D"], "answer": ["B", "C"], "id": 10, "multi": true, "answer_idx": [1, 2]}, {"set": "Bộ trích xuất 47 câu", "source_num": 11, "q": "Định nghĩa Shell: Shell là:", "options": ["Một phần của software cần thiết để cung cấp giao tiếp với các user.", "Một phần của hardware cần thiết để cung cấp giao tiếp với các user.", "Một phần của Hệ điều hành.", "Một phần của firmware cần thiết để cung cấp giao tiếp với các user."], "labels": ["A", "B", "C", "D"], "answer": ["A", "C"], "id": 11, "multi": true, "answer_idx": [0, 2]}, {"set": "Bộ trích xuất 47 câu", "source_num": 12, "q": "Kết thúc tiến trình: Sau khi một Tiến trình được khởi tạo, nó bắt đầu được lập lịch và thực hiện công việc. Nếu một program đang sử dụng compiler, khi xong việc nó thực hiện một system call để báo cho hệ điều hành. Trong Linux system call nào sau sẽ được gọi?", "options": ["Error", "exit", "ExitProcess"], "labels": ["B", "C", "D"], "answer": ["C"], "id": 12, "multi": false, "answer_idx": [1]}, {"set": "Bộ trích xuất 47 câu", "source_num": 13, "q": "Daemon Processes: Các tiến trình chạy ở chế độ background để điều khiển một số các hoạt động như email, các trang Web, in ấn được gọi là:", "options": ["interrupts", "system calls", "forks", "daemon processes"], "labels": ["A", "B", "C", "D"], "answer": ["D"], "id": 13, "multi": false, "answer_idx": [3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 14, "q": "Mô hình Client-Server: Trong cấu trúc Hệ điều hành, mô hình Client-Server giao tiếp giữa các tiến trình Clients và các tiến trình Servers thường bằng:", "options": ["mapped memory", "interrupt", "shared memory", "message passing"], "labels": ["A", "B", "C", "D"], "answer": ["D"], "id": 14, "multi": false, "answer_idx": [3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 15, "q": "Superscalar CPU: Superscalar CPU được thiết kế để:", "options": ["chia sẻ bộ nhớ", "interrupt", "ánh xạ bộ nhớ", "thực thi nhiều chỉ lệnh trên một chu kỳ clock"], "labels": ["A", "B", "C", "D"], "answer": ["D"], "id": 15, "multi": false, "answer_idx": [3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 16, "q": "Hệ điều hành Server: Phát biểu nào sau đây về hệ điều hành Server là đúng?", "options": ["Chạy trên các Server là các PC workstation, hay thậm chí cả các máy mainframe.", "Các Websites sử dụng Server để lưu các trang Web và xử lý các yêu cầu đến.", "Phục vụ nhiều user cùng một lúc thông qua network và cho phép chia sẻ tài nguyên phần cứng, phần mềm.", "Không thể cung cấp các dịch vụ in, file hay Web."], "labels": ["A", "B", "C", "D"], "answer": ["A", "B", "C"], "id": 16, "multi": true, "answer_idx": [0, 1, 2]}, {"set": "Bộ trích xuất 47 câu", "source_num": 17, "q": "Chuyển điều khiển sang HĐH: Một tiến trình đang chạy ở chế độ user và gọi một dịch vụ của hệ điều hành, nó cần phải thực thi ... để chuyển điều khiển sang Hệ điều hành (chế độ kernel).", "options": ["Chuyển đổi (switching)", "Một lời gọi hệ thống (system call)", "Một lệnh trap (trap instruction)", "Một ngắt (interrupt) hoặc một lệnh trap (trap instruction)"], "labels": ["A", "B", "C", "D"], "answer": ["D"], "id": 17, "multi": false, "answer_idx": [3]}, {"set": "Bộ trích xuất 47 câu", "source_num": 18, "q": "Lập lịch Thread Local: Giả sử Tiến trình A có 4 threads, tiến trình B có 3 threads đang chạy ở chế độ lập lịch local (local scheduling), quantum 50 msec và mỗi thread chạy 10msec/CPU burst. Thứ tự lập lịch nào cho các threads ở mức user là đúng?", "options": ["A1, A2, A3, A4, B1, B2, B3...", "A1, B1, A2, B2...", "B1, A1, B2, A2..."], "labels": ["A", "B", "C"], "answer": ["A"], "id": 18, "multi": false, "answer_idx [...new Set(ALL.map(q=>q.set))].forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;$('set').appendChild(o)});
function choosePool(){let p=ALL.filter(q=>!$('set').value||q.set===$('set').value);let n=$('mode').value;if(n!=='all')p=[...p].sort(()=>Math.random()-.5).slice(0,+n);current=p;render()}
function selected(q){return [...document.querySelectorAll(`[name="q${q.id}"]:checked`)].map(x=>+x.value).sort((a,b)=>a-b)}function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
function render(){quiz.innerHTML='';let term=$('search').value.toLowerCase().trim(),showWrong=document.body.dataset.wrong==='1';let shown=current.filter(q=>(!term||q.q.toLowerCase().includes(term))&&(!showWrong||wrongSet.has(q.id)));shown.forEach((q,z)=>{let c=document.createElement('section');c.className='card';c.dataset.id=q.id;let typ=q.multi?'checkbox':'radio';c.innerHTML=`<div class="meta">${q.set}${q.source_num?' · Câu '+q.source_num:''} · Mã ${q.id}${q.multi?' · Chọn nhiều':''}</div><div class="q">${q.q}</div>${q.options.map((o,i)=>`<label><input type="${typ}" name="q${q.id}" value="${i}"> ${q.labels[i]||String.fromCharCode(65+i)}. ${o}</label>`).join('')}<div class="fb"></div>`;quiz.appendChild(c);(store[q.id]||[]).forEach(v=>{let e=c.querySelector(`input[value="${v}"]`);if(e)e.checked=true});c.querySelectorAll('input').forEach(e=>e.onchange=save)});progress();if(!shown.length)quiz.innerHTML='<div class="notice">Không có câu phù hợp.</div>'}
function save(){current.forEach(q=>store[q.id]=selected(q));localStorage.setItem('fullOSQuiz',JSON.stringify(store));progress()}function progress(){let cards=[...document.querySelectorAll('.card')],n=cards.filter(c=>c.querySelector('input:checked')).length;$('prog').style.width=(cards.length?n/cards.length*100:0)+'%'}
$('submit').onclick=()=>{wrongSet.clear();let ok=0,graded=0,blank=0,manual=0;current.forEach(q=>{let c=document.querySelector(`.card[data-id="${q.id}"]`);if(!c)return;let got=selected(q);if(!got.length)blank++;if(!q.answer_idx.length){manual++;c.querySelector('.fb').textContent='• Câu nguồn chưa có đáp án chắc chắn: tự đối chiếu.';return}graded++;if(same(got,[...q.answer_idx].sort((a,b)=>a-b))){ok++;c.classList.add('ok');c.querySelector('.fb').textContent='✓ Đúng'}else{wrongSet.add(q.id);c.classList.add('bad');c.querySelector('.fb').textContent='✗ Sai. Đáp án: '+q.answer.join(', ')}});$('notice').innerHTML=`Đã chấm: <b>${ok}/${graded}</b> câu có đáp án (${graded?Math.round(ok/graded*100):0}%). Bỏ trống: ${blank}. Tự đối chiếu: ${manual}. Câu sai: ${wrongSet.size}.`;window.scrollTo({top:0,behavior:'smooth'})};
$('start').onclick=choosePool;$('search').oninput=render;$('wrong').onclick=()=>{document.body.dataset.wrong=document.body.dataset.wrong==='1'?'0':'1';render()};$('reset').onclick=()=>{if(confirm('Xóa toàn bộ bài làm đã lưu?')){localStorage.removeItem('fullOSQuiz');location.reload()}};render();
