<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trắc Nghiệm Python - 100 Câu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        
        .container {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            gap: 20px;
            height: 92vh;
        }

        .main-quiz {
            flex: 3;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .question-text { font-size: 19px; font-weight: 600; margin-bottom: 25px; line-height: 1.5; color: #1a1a1a;}
        
        .options-list { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; overflow-y: auto;}
        
        .option-item {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            background: #fff;
        }
        .option-item:hover { background-color: #f8f9fa; border-color: #b3d7ff; }
        .option-item.selected { border-color: #007bff; background-color: #e6f2ff; font-weight: 500; color: #0056b3;}

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-nav { background-color: #6c757d; color: white; }
        .btn-nav:hover { background-color: #5a6268; }
        .btn-nav:disabled { background-color: #cccccc; cursor: not-allowed; }
        .btn-flag { background-color: #ffc107; color: #000; display: flex; align-items: center; gap: 5px;}
        .btn-flag:hover { background-color: #e0a800; }
        
        .sidebar {
            flex: 1.2;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-title { text-align: center; margin-top: 0; margin-bottom: 15px; font-size: 18px; }
        
        .grid-questions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            overflow-y: auto;
            flex-grow: 1;
            align-content: start;
            padding-right: 5px;
        }
        
        .grid-questions::-webkit-scrollbar { width: 6px; }
        .grid-questions::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .q-box {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            position: relative;
            background: #fafafa;
        }
        .q-box:hover { background: #eee; }
        .q-box.active { border: 2px solid #212529; font-weight: bold; background: #fff;}
        .q-box.answered { background-color: #007bff; color: white; border-color: #007bff; }
        .q-box.flagged::after {
            content: '🚩';
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 12px;
        }

        .btn-submit {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
        }
        .btn-submit:hover { background-color: #218838; }

        #result-screen { display: none; text-align: center; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: 30px auto; }
        .score-text { font-size: 65px; color: #007bff; font-weight: bold; margin: 10px 0; }
        .detail-review { text-align: left; margin-top: 25px; max-height: 500px; overflow-y: auto; padding: 20px; border: 1px solid #dee2e6; border-radius: 8px; background: #f8f9fa;}
        .wrong-item { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #ccc; font-size: 15px;}
        .wrong-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .correct-ans { color: #28a745; font-weight: bold; display: block; margin-top: 5px;}
        .wrong-ans { color: #dc3545; display: block; margin-top: 5px;}
        
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .sidebar { flex: none; height: 350px; }
            .grid-questions { grid-template-columns: repeat(8, 1fr); }
        }
    </style>
</head>
<body>

<div class="container" id="quiz-app">
    <div class="main-quiz">
        <div class="header">
            <h3 style="margin: 0; color: #007bff;" id="q-number">Câu 1 / 100</h3>
            <button class="btn-flag" onclick="toggleFlag()" id="btn-flag">🚩 Gắn cờ</button>
        </div>
        
        <div class="question-text" id="q-text">Đang tải...</div>
        
        <div class="options-list" id="options-container"></div>

        <div class="actions">
            <button class="btn-nav" id="btn-prev" onclick="changeQuestion(-1)">❮ Trước</button>
            <button class="btn-nav" id="btn-next" onclick="changeQuestion(1)">Sau ❯</button>
        </div>
    </div>

    <div class="sidebar">
        <h3 class="sidebar-title">Bảng Điều Hướng</h3>
        <div class="grid-questions" id="q-grid"></div>
        <button class="btn-submit" onclick="submitQuiz()">Nộp Bài Khảo Sát</button>
    </div>
</div>

<div id="result-screen">
    <h2 style="margin-top:0;">📊 Kết Quả Bài Thi Python</h2>
    <div class="score-text" id="final-score">0/100</div>
    <p id="score-percent" style="font-size: 18px; font-weight: bold; color: #6c757d;"></p>
    
    <div class="detail-review" id="review-container">
        <!-- JS render -->
    </div>
    <br>
    <button class="btn-nav" style="padding: 15px 30px;" onclick="location.reload()">🔄 Làm lại từ đầu</button>
</div>

<script>
    // BỘ DỮ LIỆU ĐẦY ĐỦ 100 CÂU HỎI
    const quizData = [
        // Slide 1
        { q: "Câu 1: Khái niệm 'Vòng lặp lồng nhau' trong Python mang ý nghĩa gì?", opts: ["Vòng lặp chạy vô hạn", "Nhiều vòng lặp chạy nối tiếp nhau", "Một vòng lặp nằm bên trong một vòng lặp khác", "Vòng lặp không có điều kiện dừng"], ans: 2 },
        { q: "Câu 2: Để vẽ một hình vuông bằng ký tự '*', ta thường dùng cấu trúc nào?", opts: ["if...else", "Vòng lặp for lồng nhau", "Hàm len()", "Biến kiểu List"], ans: 1 },
        { q: "Câu 3: Trong cấu trúc lồng nhau để vẽ hình, vòng lặp bên ngoài thường đại diện cho yếu tố nào?", opts: ["Số cột (chiều ngang)", "Số hàng (chiều dọc)", "Ký tự in ra", "Khoảng trắng"], ans: 1 },
        { q: "Câu 4: Tham số end=\"\" trong câu lệnh print(\"*\", end=\"\") có tác dụng gì?", opts: ["Xuống dòng ngay lập tức", "Kết thúc chương trình", "In dấu * và không tự động xuống dòng", "Xóa dấu *"], ans: 2 },
        { q: "Câu 5: Đoạn lệnh 'for i in range(3): for j in range(3):' sẽ lặp tổng cộng bao nhiêu lần ở vòng lặp trong?", opts: ["3 lần", "6 lần", "9 lần", "12 lần"], ans: 2 },
        { q: "Câu 6: Để xuống dòng sau khi đã in xong một hàng ký tự, ta sử dụng lệnh nào trong vòng lặp ngoài?", opts: ["print()", "break", "return", "print('\\t')"], ans: 0 },
        { q: "Câu 7: Để vẽ hình chữ nhật có kích thước a x b (a hàng, b cột), 2 vòng lặp for lồng nhau cần dùng range() như thế nào?", opts: ["range(a) và range(a)", "range(a) và range(b)", "range(b) và range(b)", "Không dùng range()"], ans: 1 },
        { q: "Câu 8: Để in nửa tam giác vuông, biến trong range() của vòng lặp bên trong thường thay đổi theo biến nào?", opts: ["Biến đếm của vòng lặp ngoài", "Không thay đổi", "Phụ thuộc vào biến string", "Hàm số toán học"], ans: 0 },
        { q: "Câu 9: Để in ra một khoảng trắng thay vì ký tự '*', ta dùng lệnh nào?", opts: ["print(' ')", "print(space)", "print(0)", "print(null)"], ans: 0 },
        { q: "Câu 10: Chương trình vẽ hình thoi bằng dấu '*' cần sử dụng kiến thức nào?", opts: ["Hàm def", "File thao tác", "List lồng nhau", "Kết hợp vòng lặp in khoảng trắng và in dấu *"], ans: 3 },

        // Slide 2
        { q: "Câu 11: Từ khóa nào được sử dụng để khai báo một hàm trong Python?", opts: ["function", "def", "create", "fun"], ans: 1 },
        { q: "Câu 12: Cú pháp khai báo hàm nào sau đây là đúng chuẩn Python?", opts: ["def tinh_dien_tich():", "function tinh_dien_tich()", "def tinh_dien_tich:", "tinh_dien_tich def():"], ans: 0 },
        { q: "Câu 13: Ưu điểm lớn nhất của việc sử dụng Hàm (Function) là gì?", opts: ["Tăng tốc độ máy tính", "Mã lệnh ngắn gọn, dễ quản lý, tái sử dụng", "Đổi màu văn bản", "Bỏ qua các lỗi code"], ans: 1 },
        { q: "Câu 14: Các giá trị được truyền vào trong cặp ngoặc đơn () khi định nghĩa hàm được gọi là gì?", opts: ["Biến cục bộ", "Từ khóa", "Tham số (Parameter)", "Lệnh rẽ nhánh"], ans: 2 },
        { q: "Câu 15: Để thực thi (gọi) một hàm có tên 've_hinh', ta viết như thế nào?", opts: ["call ve_hinh", "run ve_hinh", "ve_hinh()", "def ve_hinh"], ans: 2 },
        { q: "Câu 16: Dự án tạo thư viện tính diện tích hình chữ nhật cần truyền vào hàm bao nhiêu tham số?", opts: ["0", "1", "2 (chiều dài, chiều rộng)", "3"], ans: 2 },
        { q: "Câu 17: Công thức tính diện tích hình tam giác (đáy x chiều cao / 2) viết chuẩn Python là?", opts: ["day x chieu_cao : 2", "(day * chieu_cao) / 2", "day * chieu_cao // 2", "day + chieu_cao / 2"], ans: 1 },
        { q: "Câu 18: Khi định nghĩa nội dung bên trong hàm, các dòng lệnh phải tuân thủ nguyên tắc nào?", opts: ["Phải in đậm", "Phải thụt lề (Indentation)", "Phải viết hoa", "Không cần thụt lề"], ans: 1 },
        { q: "Câu 19: Hàm tính diện tích hình vuông def dien_tich_hv(canh): cần nhận vào mấy tham số?", opts: ["1 tham số", "2 tham số", "3 tham số", "4 tham số"], ans: 0 },
        { q: "Câu 20: Một hàm trong Python có bắt buộc phải có tham số truyền vào hay không?", opts: ["Luôn luôn phải có", "Không bắt buộc", "Bắt buộc nếu là kiểu số", "Bắt buộc nếu là chuỗi"], ans: 1 },

        // Slide 3
        { q: "Câu 21: Từ khóa nào được sử dụng để trả về một giá trị từ hàm?", opts: ["print", "return", "output", "get"], ans: 1 },
        { q: "Câu 22: Điểm khác biệt lớn nhất giữa return và print() là gì?", opts: ["Không có", "print() lưu vào biến, return thì không", "return trả về giá trị, print() chỉ hiển thị màn hình", "return chỉ dùng cho chuỗi"], ans: 2 },
        { q: "Câu 23: Khi hàm gặp từ khóa return, chuyện gì sẽ xảy ra với các câu lệnh bên dưới nó?", opts: ["Chạy bình thường", "Bị báo lỗi syntax", "Chạy ngầm", "Bị bỏ qua, hàm kết thúc ngay lập tức"], ans: 3 },
        { q: "Câu 24: Cấu trúc rẽ nhánh nào thường được dùng để tạo Menu chọn chức năng?", opts: ["if...elif...else", "for...in", "while...break", "def...return"], ans: 0 },
        { q: "Câu 25: Trong phép chia, ta phải kiểm tra điều kiện gì của mẫu số?", opts: ["Bằng 0", "Khác 0", "Lớn hơn 0", "Nhỏ hơn 0"], ans: 1 },
        { q: "Câu 26: Nếu hàm có lệnh 'return a + b', nó có ý nghĩa gì?", opts: ["In ra chữ 'a + b'", "Trả về tổng của hai biến a và b", "Dừng chương trình", "Không có ý nghĩa"], ans: 1 },
        { q: "Câu 27: Cú pháp của câu lệnh elif là viết tắt của từ nào?", opts: ["else if", "end if", "every if", "error if"], ans: 0 },
        { q: "Câu 28: Nhánh else cuối cùng thường được dùng để làm gì trong menu?", opts: ["Cộng hai số", "Hiển thị thông báo khi nhập sai", "Chia hai số", "Thoát chương trình"], ans: 1 },
        { q: "Câu 29: Có thể gán kết quả của một hàm có chứa return vào một biến không?", opts: ["Có", "Không", "Chỉ được với số âm", "Lỗi cú pháp"], ans: 0 },
        { q: "Câu 30: Một hàm có thể có nhiều lệnh return ở các nhánh rẽ if/elif khác nhau không?", opts: ["Không thể", "Có thể", "Báo lỗi ngay", "Chỉ được tối đa 2"], ans: 1 },

        // Slide 4
        { q: "Câu 31: Kiểu dữ liệu nào lưu trữ một tập hợp nhiều phần tử theo thứ tự?", opts: ["int", "float", "List (Danh sách)", "boolean"], ans: 2 },
        { q: "Câu 32: Ký hiệu nào dùng để khởi tạo một List?", opts: ["Ngoặc tròn ()", "Ngoặc nhọn {}", "Ngoặc vuông []", "Ngoặc kép \"\""], ans: 2 },
        { q: "Câu 33: Cú pháp tạo danh sách rỗng?", opts: ["danh_ba = List()", "danh_ba = []", "danh_ba = {}", "danh_ba = empty"], ans: 1 },
        { q: "Câu 34: Phương thức nào THÊM phần tử vào CUỐI danh sách?", opts: ["add()", "insert()", "append()", "push()"], ans: 2 },
        { q: "Câu 35: Phương thức nào XÓA phần tử dựa trên giá trị của nó?", opts: ["delete()", "remove()", "pop()", "clear()"], ans: 1 },
        { q: "Câu 36: Phương thức insert(index, value) thực hiện chức năng gì?", opts: ["Ghi đè giá trị", "Xóa giá trị", "Chèn value vào vị trí index", "Tìm kiếm giá trị"], ans: 2 },
        { q: "Câu 37: Phần tử đầu tiên của một List có chỉ số (index) là bao nhiêu?", opts: ["1", "0", "-1", "Không có chỉ số"], ans: 1 },
        { q: "Câu 38: Nếu remove('Nam') nhưng 'Nam' không có trong list, điều gì xảy ra?", opts: ["Bỏ qua", "Trả về rỗng", "Báo lỗi ValueError", "Tự thêm vào"], ans: 2 },
        { q: "Câu 39: Để lấy phần tử ở vị trí thứ 3 trong list, ta gọi chỉ số (index) là mấy?", opts: ["3", "1", "2", "4"], ans: 2 },
        { q: "Câu 40: Có thể lưu hỗn hợp kiểu số và chuỗi trong cùng một List không?", opts: ["Được", "Không được", "Chỉ lưu được số", "Chỉ lưu được chuỗi"], ans: 0 },

        // Slide 5
        { q: "Câu 41: Cấu trúc vòng lặp nào thường dùng nhất để duyệt qua phần tử trong List?", opts: ["while", "for...in...", "do...while", "switch"], ans: 1 },
        { q: "Câu 42: Hàm nào trả về tổng số lượng phần tử của một List?", opts: ["count()", "size()", "len()", "length()"], ans: 2 },
        { q: "Câu 43: Hàm round(diem_tb, 2) dùng để làm gì?", opts: ["Cắt bỏ thập phân", "Làm tròn đến 2 chữ số thập phân", "Random số", "Thêm số 2 vào cuối"], ans: 1 },
        { q: "Câu 44: Để tính tổng, ta khởi tạo tong = 0, rồi lặp và dùng phép toán nào?", opts: ["tong = tong - diem", "tong = tong * diem", "tong = tong + diem", "tong = diem / 2"], ans: 2 },
        { q: "Câu 45: Điểm trung bình tính bằng công thức nào?", opts: ["Tổng điểm / len(danh_sach_diem)", "Tổng điểm * 2", "max(diem) / min(diem)", "len() * Tổng điểm"], ans: 0 },
        { q: "Câu 46: Trong vòng lặp 'for d in [7, 8, 9]:', ở lần lặp thứ 2, biến d mang giá trị mấy?", opts: ["7", "8", "9", "0"], ans: 1 },
        { q: "Câu 47: Để tính trung bình, ta phải đảm bảo danh sách không ở trạng thái nào để tránh lỗi chia 0?", opts: ["Chứa số 0", "Chứa số âm", "Là danh sách rỗng (len=0)", "Chứa số thập phân"], ans: 2 },
        { q: "Câu 48: Biến lưu Tổng ban đầu luôn phải khởi tạo bằng giá trị bao nhiêu?", opts: ["1", "-1", "0", "100"], ans: 2 },
        { q: "Câu 49: Kết quả của len([5, 6, 7, 8]) là:", opts: ["4", "26", "8", "5"], ans: 0 },
        { q: "Câu 50: Dự án Slide 5 rèn luyện kỹ năng kết hợp for và hàm tích hợp để làm gì?", opts: ["Xử lý ảnh", "Lập trình Game", "Tính tổng và trung bình mảng số", "Bật tắt file"], ans: 2 },

        // Slide 6
        { q: "Câu 51: Hàm tìm giá trị LỚN NHẤT trong danh sách?", opts: ["highest()", "max()", "top()", "ceil()"], ans: 1 },
        { q: "Câu 52: Hàm tìm giá trị NHỎ NHẤT trong danh sách?", opts: ["min()", "floor()", "lowest()", "bottom()"], ans: 0 },
        { q: "Câu 53: Phương thức sort() mặc định sắp xếp danh sách theo thứ tự nào?", opts: ["Giảm dần", "Ngẫu nhiên", "Tăng dần (Từ nhỏ đến lớn)", "Không thay đổi"], ans: 2 },
        { q: "Câu 54: Để sắp xếp bảng điểm GIẢM DẦN, ta thêm tham số nào vào sort()?", opts: ["descending=True", "reverse=True", "reverse=False", "down=True"], ans: 1 },
        { q: "Câu 55: diem = [4, 9, 7], sau lệnh diem.sort(), danh sách đổi thành:", opts: ["[9, 7, 4]", "[4, 7, 9]", "[4, 9, 7]", "[7, 4, 9]"], ans: 1 },
        { q: "Câu 56: Sự khác biệt giữa max() và sort()?", opts: ["Không khác", "max chỉ lấy 1 giá trị, sort đổi thứ tự toàn bộ", "sort lỗi số âm", "max trả về list mới"], ans: 1 },
        { q: "Câu 57: Các hàm max(), min() có thể áp dụng cho danh sách chuỗi không?", opts: ["Không", "Có, so sánh theo bảng chữ cái", "Báo lỗi", "Trả về 0"], ans: 1 },

    const totalQuestions = quizData.length;
    let currentIndex = 0;
    
    let userAnswers = new Array(totalQuestions).fill(null);
    let flaggedQuestions = new Array(totalQuestions).fill(false);

    const qNumberEl = document.getElementById('q-number');
    const qTextEl = document.getElementById('q-text');
    const optionsContainer = document.getElementById('options-container');
    const gridContainer = document.getElementById('q-grid');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFlag = document.getElementById('btn-flag');

    function initQuiz() {
        buildGrid();
        loadQuestion(0);
    }

    function buildGrid() {
        gridContainer.innerHTML = '';
        for (let i = 0; i < totalQuestions; i++) {
            const box = document.createElement('div');
            box.className = 'q-box';
            box.innerText = i + 1;
            box.id = `box-${i}`;
            box.onclick = () => loadQuestion(i);
            gridContainer.appendChild(box);
        }
    }

    function loadQuestion(index) {
        currentIndex = index;
        const currentData = quizData[index];
        
        qNumberEl.innerText = `Câu ${index + 1} / ${totalQuestions}`;
        qTextEl.innerText = currentData.q;
        
        btnFlag.style.backgroundColor = flaggedQuestions[index] ? '#e0a800' : '#ffc107';
        btnFlag.innerText = flaggedQuestions[index] ? '🚩 Đã gắn cờ' : '🚩 Gắn cờ';

        optionsContainer.innerHTML = '';
        currentData.opts.forEach((optText, optIndex) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = optText;
            
            if (userAnswers[index] === optIndex) {
                div.classList.add('selected');
            }
            
            div.onclick = () => selectOption(optIndex);
            optionsContainer.appendChild(div);
        });

        updateNavButtons();
        updateGridUI();
    }

    function selectOption(optIndex) {
        userAnswers[currentIndex] = optIndex;
        loadQuestion(currentIndex);
    }

    function toggleFlag() {
        flaggedQuestions[currentIndex] = !flaggedQuestions[currentIndex];
        loadQuestion(currentIndex);
    }

    function changeQuestion(step) {
        let newIndex = currentIndex + step;
        if (newIndex >= 0 && newIndex < totalQuestions) {
            loadQuestion(newIndex);
        }
    }

    function updateNavButtons() {
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === totalQuestions - 1;
    }

    function updateGridUI() {
        for (let i = 0; i < totalQuestions; i++) {
            const box = document.getElementById(`box-${i}`);
            box.className = 'q-box';
            
            if (i === currentIndex) box.classList.add('active');
            if (userAnswers[i] !== null) box.classList.add('answered');
            if (flaggedQuestions[i]) box.classList.add('flagged');
        }
    }

    function submitQuiz() {
        const unattempted = userAnswers.filter(ans => ans === null).length;
        if (unattempted > 0) {
            if (!confirm(`Bạn còn ${unattempted} câu chưa trả lời. Chắc chắn nộp bài?`)) return;
        } else {
            if (!confirm(`Bạn đã hoàn thành 100/100 câu. Xác nhận nộp bài?`)) return;
        }
        calculateScore();
    }

    function calculateScore() {
        let score = 0;
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '<h3>Chi tiết các câu chưa chính xác:</h3>';
        let hasWrong = false;

        for (let i = 0; i < totalQuestions; i++) {
            if (userAnswers[i] === quizData[i].ans) {
                score++;
            } else {
                hasWrong = true;
                let userChoiceText = userAnswers[i] !== null ? quizData[i].opts[userAnswers[i]] : "Chưa làm";
                let correctChoiceText = quizData[i].opts[quizData[i].ans];
                
                reviewContainer.innerHTML += `
                    <div class="wrong-item">
                        <strong>Câu ${i + 1}:</strong> ${quizData[i].q}<br>
                        <span class="wrong-ans">❌ Đã chọn: ${userChoiceText}</span>
                        <span class="correct-ans">✅ Đúng là: ${correctChoiceText}</span>
                    </div>
                `;
            }
        }

        document.getElementById('quiz-app').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').innerText = `${score}/${totalQuestions}`;
        let percent = ((score / totalQuestions) * 100).toFixed(1);
        document.getElementById('score-percent').innerText = `Tỷ lệ chính xác: ${percent}%`;
        
        if (!hasWrong) {
            reviewContainer.innerHTML = '<h3>🎉 Tuyệt vời! Điểm tuyệt đối 100/100!</h3>';
            reviewContainer.style.textAlign = "center";
            reviewContainer.style.color = "#28a745";
        }
    }

    // Bắt đầu
    initQuiz();
</script>
